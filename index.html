<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaoCap Tech | Termux Mini</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .terminal { background: #161b22; border: 1px solid #30363d; border-radius: 8px; width: 85%; max-width: 800px; height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; }
        .header { display: flex; border-bottom: 1px solid #30363d; padding: 12px; background: #161b22; }
        .btn { width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; }
        .close { background: #ff5f56; } .min { background: #ffbd2e; } .max { background: #27c93f; }
        .terminal-body { padding: 15px; overflow-y: auto; flex-grow: 1; font-size: 15px; line-height: 1.5; }
        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        .text-green { color: #7ee787; font-weight: bold; } .text-blue { color: #79c0ff; font-weight: bold; } .text-gray { color: #8b949e; } .text-red { color: #ff7b72; } .text-yellow { color: #d2a8ff; }
        .input-line { display: flex; align-items: center; margin-top: 5px; }
        .prompt { white-space: nowrap; margin-right: 8px; }
        input[type="text"] { background: transparent; border: none; color: #c9d1d9; font-family: inherit; font-size: inherit; flex-grow: 1; outline: none; padding: 0; caret-color: #c9d1d9; }
        .output { margin-bottom: 5px; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>
    <div class="terminal" onclick="document.getElementById('cmd-input').focus()">
        <div class="header"><div class="btn close"></div><div class="btn min"></div><div class="btn max"></div></div>
        <div class="terminal-body" id="term-body">
            <div id="history">
                <div class="output">Welcome to CaoCap Termux Simulator!<br>Type <span class="text-yellow">help</span> to see available commands.</div>
            </div>
            <div class="input-line">
                <span class="prompt" id="prompt-text"></span>
                <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <script>
        // Hệ thống file ảo (Virtual File System)
        let vfs = {
            "home": {
                "caocap": {
                    "kernel_dev": {
                        "a05_defconfig.txt": "CONFIG_KSU=y\nCONFIG_APATCH=y\n# Build custom kernel for Samsung A05"
                    },
                    "roblox": {
                        "bloxfruits_sea3.lua": 'print("Auto farm loaded...")\n_G.FastAttack = true'
                    },
                    "openwrt": {
                        "wifi_ai.sh": "#!/bin/sh\n# mwan3 load balancing script"
                    },
                    "readme.txt": "Bro đang xài giả lập hệ thống file do tui code =))"
                }
            }
        };

        let cwd = ["home", "caocap"]; // Current Working Directory

        const input = document.getElementById('cmd-input');
        const history = document.getElementById('history');
        const termBody = document.getElementById('term-body');
        const promptEl = document.getElementById('prompt-text');

        function updatePrompt() {
            let path = cwd.join('/').replace('home/caocap', '~');
            promptEl.innerHTML = `<span class="text-green">root@caocap</span>:<span class="text-blue">${path}</span>$`;
        }
        updatePrompt();

        function getDir(pathArray) {
            let curr = vfs;
            for (let p of pathArray) {
                if (curr[p] && typeof curr[p] === 'object') curr = curr[p];
                else return null;
            }
            return curr;
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const rawCmd = this.value.trim();
                if (!rawCmd) return;
                
                const args = rawCmd.split(' ').filter(x => x);
                const cmd = args[0].toLowerCase();
                
                history.innerHTML += `<div>${promptEl.innerHTML} ${rawCmd}</div>`;
                
                let currentFolder = getDir(cwd);
                let out = "";

                try {
                    if (cmd === 'clear') { history.innerHTML = ''; out = null; }
                    else if (cmd === 'help') {
                        out = `Commands: <span class="text-yellow">ls, cd, pwd, cat, touch, mkdir, rm, clear, neofetch</span>`;
                    }
                    else if (cmd === 'pwd') {
                        out = '/' + cwd.join('/');
                    }
                    else if (cmd === 'ls') {
                        let targetFolder = currentFolder;
                        if (args[1]) {
                            if (args[1] === '..') targetFolder = getDir(cwd.slice(0, -1)) || currentFolder;
                            else if (currentFolder[args[1]] && typeof currentFolder[args[1]] === 'object') targetFolder = currentFolder[args[1]];
                        }
                        out = Object.keys(targetFolder).map(k => typeof targetFolder[k] === 'object' ? `<span class="text-blue">${k}/</span>` : k).join('  ');
                    }
                    else if (cmd === 'cd') {
                        let dir = args[1];
                        if (!dir || dir === '~') cwd = ["home", "caocap"];
                        else if (dir === '..') { if (cwd.length > 1) cwd.pop(); }
                        else if (currentFolder[dir] && typeof currentFolder[dir] === 'object') cwd.push(dir);
                        else out = `<span class="text-red">cd: ${dir}: No such directory</span>`;
                        updatePrompt();
                    }
                    else if (cmd === 'cat') {
                        let file = args[1];
                        if (!file) out = "cat: missing operand";
                        else if (currentFolder[file] && typeof currentFolder[file] === 'string') out = currentFolder[file];
                        else out = `<span class="text-red">cat: ${file}: No such file</span>`;
                    }
                    else if (cmd === 'touch') {
                        if (args[1]) currentFolder[args[1]] = "";
                        else out = "touch: missing file operand";
                    }
                    else if (cmd === 'mkdir') {
                        if (args[1]) currentFolder[args[1]] = {};
                        else out = "mkdir: missing operand";
                    }
                    else if (cmd === 'rm') {
                        if (args[1] && currentFolder[args[1]]) delete currentFolder[args[1]];
                        else out = `rm: cannot remove '${args[1]}': No such file or directory`;
                    }
                    else if (cmd === 'neofetch') {
                        out = `<span class="text-green">   /\\   </span> <span class="text-green">root</span>@<span class="text-green">caocap</span>\n<span class="text-green">  /  \\  </span> OS: CaoCap Web OS\n<span class="text-green"> /____\\ </span> Kernel: JS VFS 1.0\n<span class="text-green">/      \\</span> Shell: js-bash`;
                    }
                    else {
                        out = `<span class="text-red">bash: ${cmd}: command not found</span>`;
                    }
                } catch (err) { out = `<span class="text-red">Error executing command</span>`; }

                if (out !== null && out !== "") history.innerHTML += `<div class="output">${out}</div>`;
                
                this.value = '';
                termBody.scrollTop = termBody.scrollHeight;
            }
        });
    </script>
</body>
</html>
