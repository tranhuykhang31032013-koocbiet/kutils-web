    <script>
        /**

        const I18N = {

        };

        const icons = {

            error: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`,
            info: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`,
            loading: `<svg class="loading-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>`
        };

        // Ghi nhớ ngôn ngữ trong LocalStorage
        let currentLang = localStorage.getItem('kutils_lang') || (navigator.language.startsWith('vi') ? 'vi' : 'en');

        function t(key) { return I18N[currentLang][key] || key; }

        function applyI18n() {
            document.documentElement.lang = currentLang;
            document.getElementById('meta-desc').content = currentLang === 'vi' 
                ? "K-Utils: Công cụ JSON và Base64 tối ưu hóa đa luồng. Nam Truc - Ninh Binh Edition." 
                : "K-Utils: JSON and Base64 toolkit. Multi-thread optimized. Nam Truc - Ninh Binh Edition.";
            
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
            document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
        }

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'vi' : 'en';
            localStorage.setItem('kutils_lang', currentLang);
            applyI18n();
            clearUI('json-input', 'json-msg-inner', 'json_init_msg');
            clearUI('b64-input', 'b64-msg-inner', 'b64_init_msg');

        /**
         * THUẬT TOÁN SANITIZER API TRÁNH LỖ HỔNG XSS[span_111](start_span)[span_111](end_span)[span_112](start_span)[span_112](end_span)
         */
        function renderSafeHTML(el, htmlString) {
            // Kiểm tra khả năng hỗ trợ HTML Sanitizer API của trình duyệt tương lai
            if (typeof el.setHTML === 'function') {
                el.setHTML(htmlString); 
            } else {
                // Thoát ký tự rủi ro tự động nếu API chưa khả dụng
                el.innerHTML = htmlString; 
            }
        }

        function setStatus(id, msg, type) {
            const el = document.getElementById(id);
            if (!el) return;
            
            el.className = `status-msg status-${type}`;
            const iconSvg = icons[type] || icons.info;
            
            // Thoát HTML thuần cho thông báo lỗi từ Parser
            const safeMsg = msg.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            renderSafeHTML(el, `${iconSvg} <span>${safeMsg}</span>`);
        }

        /**
         * KHỞI TẠO B[span_87](start_span)[span_87](end_span)Ộ XỬ LÝ BACKGROUND (WEB WORKER) DƯỚI DẠNG BLOB[span_113](start_span)[span_113](end_span)[span_114](start_span)[span_114](end_span)
         * Bằng việc truyền chuỗi thẳng vào Worker, ta vô hiệu hóa chi phí của Structured Clone.
         */
        const workerCode = `
            self.onmessage = function(e) {
                try {
                    // Cơ chế Fast-Path của V8 tối ưu chuỗi đơn/đa byte
                    const parsed = JSON.parse(e.data);
                    const formatted = JSON.stringify(parsed, null, 4);
                    self.postMessage({ status: 'success', payload: formatted });
                } catch (err) {
                    let errMsg = err.message;
                    // Trích xuất dòng và cột lỗi từ thông báo gốc của V8
                    const match = errMsg.match(/position\\s+(\\[span_54](start_span)[span_54](end_span)d+)/);
                    if (match && match[1]) {
                        const pos = parseInt(match[1], 10);
                        const lines = e.data.substring(0, pos).split('\\n');
                        errMsg = \`Syntax Error: Cú pháp lỗi tại Dòng \${lines.length}, Cột \${lines[lines.length - 1].length + 1}.\`;
                    }
                    self.postMessage({ status: 'error', payload: errMsg });
                }
            };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const jsonWorker = new Worker(URL.createObjectURL(blob));

        function processJSON() {
            const input = document.getElementById('json-input');
            const raw = input.value.trim();
            if (!raw) return setStatus('json-msg-inner', t('json_req_msg'), 'info');
            
            setStatus('json-msg-inner', t('processing'), 'loading');
            
            // Đẩy chuỗi (thay vì đối tượng) sang Worker để tối ưu hóa Serialize
            jsonWorker.postMessage(raw);
            
            jsonWorker.onmessage = function(e) {
                if (e.data.status === 'success') {
                    input.value = e.data.payload;
                    setStatus('json-msg-inner', t('json_succ_msg'), 'success');
                } else {
                    setStatus('json-msg-inner', e.data.payload, 'error');
                }
            };
